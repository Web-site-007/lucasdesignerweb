<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 60" width="200" height="60">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="200" height="60" fill="transparent"/>
  
  <!-- Code bracket left -->
  <text x="8" y="38" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#3b82f6">&lt;</text>
  
  <!-- LUCAS text with gradient -->
  <text x="28" y="38" font-family="'Arial Black', 'Impact', sans-serif" font-size="32" font-weight="900" fill="url(#grad)" letter-spacing="2">LUCAS</text>
  
  <!-- Code bracket right -->
  <text x="148" y="38" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#3b82f6">/&gt;</text>
  
  <!-- Underline accent -->
  <rect x="28" y="44" width="120" height="2" fill="url(#grad)" rx="1"/>
  
  <!-- Subtitle -->
  <text x="100" y="56" font-family="Arial, sans-serif" font-size="8" fill="#a0a0a0" text-anchor="middle" letter-spacing="1">DESIGNER / DESENVOLVEDOR WEB</text>
</svg>