<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 80" width="300" height="80">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="subtitleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3" result="blur1"/>
      <feFlood flood-color="#3b82f6" flood-opacity="0.9" result="color1"/>
      <feComposite in="color1" in2="blur1" operator="in" result="shadow1"/>
      <feGaussianBlur in="SourceAlpha" stdDeviation="5" result="blur2"/>
      <feFlood flood-color="#8b5cf6" flood-opacity="0.7" result="color2"/>
      <feComposite in="color2" in2="blur2" operator="in" result="shadow2"/>
      <feMerge>
        <feMergeNode in="shadow2"/>
        <feMergeNode in="shadow1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="300" height="80" fill="transparent"/>
  
  <!-- Code bracket left -->
  <text x="60" y="38" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#3b82f6">&lt;</text>
  
  <!-- LUCAS text with gradient -->
  <text x="80" y="38" font-family="'Arial Black', 'Impact', sans-serif" font-size="32" font-weight="900" fill="url(#grad)" letter-spacing="2">LUCAS</text>
  
  <!-- Code bracket right -->
  <text x="192" y="38" font-family="'Courier New', monospace" font-size="28" font-weight="bold" fill="#3b82f6">/&gt;</text>
  
  <!-- Underline accent -->
  <rect x="80" y="44" width="112" height="2" fill="url(#grad)" rx="1"/>
  
  <!-- Subtitle -->
  <text x="150" y="68" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#111111" text-anchor="middle" letter-spacing="1.5" filter="url(#subtitleGlow)">DESIGNER / DESENVOLVEDOR WEB</text>
</svg>