<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página não encontrada — Lucas Designer Web</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="icon" type="image/svg+xml" href="src/images/favicon.svg"/>
  <link rel="apple-touch-icon" href="src/images/apple-touch-icon.png"/>
  <link rel="preload" href="src/fonts/space-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin/>
  <link rel="stylesheet" href="src/css/style.min.css"/>
  <style>
    @font-face{font-family:'Space Grotesk';font-style:normal;font-display:optional;font-weight:100 900;src:url(src/fonts/space-grotesk-latin.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
    @font-face{font-family:'Space Grotesk Fallback';font-style:normal;font-display:optional;font-weight:100 900;src:local('Roboto'),local('Arial'),local('Segoe UI'),local('Helvetica Neue'),local('DejaVu Sans');ascent-override:98.4%;descent-override:29.2%;line-gap-override:0%}
    .error-page{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:2rem}
    .error-code{font-size:8rem;font-weight:700;background:linear-gradient(135deg,var(--primary),var(--accent,#a855f7));-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
    .error-msg{font-size:1.5rem;font-weight:600;margin:1rem 0 .5rem}
    .error-desc{color:var(--text-muted,#a0a0a0);max-width:400px;margin-bottom:2rem}
    .error-btn{display:inline-block;padding:14px 32px;background:linear-gradient(135deg,var(--primary),var(--primary-hover,#2563eb));color:#fff;font-weight:600;border-radius:8px;transition:transform .3s,box-shadow .3s;font-family:inherit;font-size:1rem;text-decoration:none}
    .error-btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(59,130,246,.4)}
  </style>
  <script>
    (function() {
      var loaded = false;
      function loadAnalytics() {
        if (loaded) return; loaded = true;
        var s = document.createElement('script');
        s.async = true;
        s.src = 'https://www.googletagmanager.com/gtag/js?id=G-YXNPQDS5EB';
        document.head.appendChild(s);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function(){dataLayer.push(arguments);};
        gtag('js', new Date());
        gtag('config', 'G-YXNPQDS5EB');
      }
      ['scroll', 'click', 'touchstart', 'keydown'].forEach(function(e) {
        window.addEventListener(e, loadAnalytics, { once: true, passive: true });
      });
      setTimeout(loadAnalytics, 10000);
    })();
  </script>
</head>
<body>
  <main class="error-page" id="main-content">
    <div class="error-code">404</div>
    <h1 class="error-msg">Página não encontrada</h1>
    <p class="error-desc">O link que você acessou não existe ou foi movido. Volte para a página inicial.</p>
    <a href="index.html" class="error-btn">Voltar ao Início</a>
  </main>
</body>
</html>
