  <line x1="60" y1="340" x2="580" y2="340" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="60" y="385" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff">+2.500</text>
  <text x="60" y="410" font-family="Arial,sans-serif" font-size="11" fill="#a0a0a0" letter-spacing="1">SITES</text>
  <text x="230" y="385" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff">100%</text>
  <text x="230" y="410" font-family="Arial,sans-serif" font-size="11" fill="#a0a0a0" letter-spacing="1">SATISFAÇÃO</text>
  <text x="400" y="385" font-family="Arial,sans-serif" font-size="32" font-weight="bold" fill="#ffffff">+8</text>
  <text x="400" y="410" font-family="Arial,sans-serif" font-size="11" fill="#a0a0a0" letter-spacing="1">ANOS</text>
  <!-- Price -->
  <text x="60" y="480" font-family="Arial,sans-serif" font-size="16" fill="#a0a0a0">A partir de</text>
  <text x="60" y="520" font-family="Arial,sans-serif" font-size="38" font-weight="bold" fill="url(#grad)">R$297</text>
  <!-- CTA -->
  <rect x="60" y="550" width="260" height="50" rx="10" fill="url(#gradBtn)"/>
  <text x="190" y="581" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="bold" fill="#ffffff">&#128172; FALE NO WHATSAPP</text>
  <!-- Right side decorative -->
  <rect x="660" y="60" width="480" height="508" rx="16" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
  <text x="900" y="200" text-anchor="middle" font-family="Arial,sans-serif" font-size="80" fill="url(#grad)">&lt;/&gt;</text>
  <text x="900" y="280" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#a0a0a0" letter-spacing="4">DESIGNER / DESENVOLVEDOR WEB</text>
