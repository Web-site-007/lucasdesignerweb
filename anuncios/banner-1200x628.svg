  <text x="900" y="370" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">Sites Profissionais</text>
  <text x="900" y="400" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">Lojas Virtuais</text>
  <text x="900" y="430" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" fill="#ffffff">Landing Pages</text>
