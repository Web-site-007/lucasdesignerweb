<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a"/>
      <stop offset="100%" style="stop-color:#111111"/>
    </linearGradient>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="gradBtn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#25d366"/>
      <stop offset="100%" style="stop-color:#128c7e"/>
    </linearGradient>
  </defs>
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Top accent line -->
  <rect x="80" y="180" width="120" height="4" rx="2" fill="url(#grad)"/>
  <!-- Badge -->
  <rect x="80" y="200" width="260" height="36" rx="18" fill="rgba(59,130,246,0.1)"/>
  <text x="210" y="223" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="600" fill="#3b82f6" letter-spacing="2">CRIAÇÃO DE SITES</text>
  <!-- Main title -->
  <text x="80" y="300" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#ffffff">Seu negócio</text>
  <text x="80" y="370" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#ffffff">merece um site que</text>
  <text x="80" y="440" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="url(#grad)">converte</text>
  <text x="310" y="440" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#ffffff">em clientes</text>
  <!-- Description -->
  <text x="80" y="500" font-family="Arial,sans-serif" font-size="20" fill="#a0a0a0">Crio sites modernos, rápidos e profissionais</text>
  <text x="80" y="530" font-family="Arial,sans-serif" font-size="20" fill="#a0a0a0">para empresas e empreendedores.</text>
  <!-- Stats -->
  <line x1="80" y1="580" x2="1000" y2="580" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <text x="80" y="630" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#ffffff">+2.500</text>
  <text x="80" y="660" font-family="Arial,sans-serif" font-size="13" fill="#a0a0a0" letter-spacing="2">SITES ENTREGUES</text>
  <text x="380" y="630" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#ffffff">100%</text>
  <text x="380" y="660" font-family="Arial,sans-serif" font-size="13" fill="#a0a0a0" letter-spacing="2">SATISFAÇÃO</text>
  <text x="650" y="630" font-family="Arial,sans-serif" font-size="42" font-weight="bold" fill="#ffffff">+8</text>
  <text x="650" y="660" font-family="Arial,sans-serif" font-size="13" fill="#a0a0a0" letter-spacing="2">ANOS DE EXPERIÊNCIA</text>
  <line x1="80" y1="690" x2="1000" y2="690" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <!-- Prices -->
  <text x="80" y="750" font-family="Arial,sans-serif" font-size="18" fill="#a0a0a0">Sites profissionais a partir de</text>
  <text x="80" y="795" font-family="Arial,sans-serif" font-size="44" font-weight="bold" fill="url(#grad)">R$297</text>
  <!-- CTA Button -->
  <rect x="80" y="850" width="320" height="60" rx="12" fill="url(#gradBtn)"/>
  <text x="240" y="887" text-anchor="middle" font-family="Arial,sans-serif" font-size="18" font-weight="bold" fill="#ffffff">&#128172; FALE NO WHATSAPP</text>
  <!-- Guarantee -->
  <text x="80" y="960" font-family="Arial,sans-serif" font-size="14" fill="#666666">&#128737; Orçamento 100% gratuito sem compromisso</text>
</svg>
