<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Obrigado — Lucas Designer Web</title>
  <meta name="robots" content="noindex, nofollow"/>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --primary: #3b82f6;
      --bg: #0a0a0a;
      --bg-card: #161616;
      --text: #f5f5f5;
      --text-secondary: #a0a0a0;
      --border: rgba(255,255,255,0.08);
      --success: #22c55e;
      --font: 'Space Grotesk', sans-serif;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { font-family:var(--font); background:var(--bg); color:var(--text); min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px 20px; }

    .thankyou { text-align:center; max-width:500px; }
    .thankyou__icon { font-size:4rem; margin-bottom:16px; }
    .thankyou__title { font-size:2rem; font-weight:700; margin-bottom:12px; }
    .thankyou__desc { font-size:1rem; color:var(--text-secondary); margin-bottom:32px; line-height:1.6; }

    .btn {
      display:inline-flex;align-items:center;gap:8px;
      padding:16px 32px;font-size:1rem;font-weight:600;
      border-radius:12px;transition:all 0.25s ease;text-decoration:none;cursor:pointer;border:none;
    }
    .btn--whatsapp { background:#25d366;color:#fff; }
    .btn--whatsapp:hover { background:#1da851;transform:translateY(-2px);color:#fff; }
    .btn--primary { background:var(--primary);color:#fff; }
    .btn--primary:hover { background:#2563eb;transform:translateY(-2px);color:#fff; }

    .thankyou__timer { margin-top:24px;font-size:0.85rem;color:var(--text-secondary); }
  </style>
</head>
<body>

  <!-- GOOGLE ANALYTICS -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-YXNPQDS5EB"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-YXNPQDS5EB');
  </script>

  <!-- META PIXEL -->
  <script>
    !function(f,b,e,v,n,t,s)
    {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
    n.callMethod.apply(n,arguments):n.queue.push(arguments)};
    if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
    n.queue=[];t=b.createElement(e);t.async=!0;
    t.src=v;s=b.getElementsByTagName(e)[0];
    s.parentNode.insertBefore(t,s)}(window, document,'script',
    'https://connect.facebook.net/en_US/fbevents.js');
    fbq('init', 'SEU_PIXEL_ID_AQUI');
    fbq('track', 'PageView');
    fbq('track', 'Lead');
  </script>
  <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=SEU_PIXEL_ID_AQUI&ev=PageView&noscript=1"/></noscript>

  <div class="thankyou">
    <div class="thankyou__icon">&#10004;</div>
    <h1 class="thankyou__title">Mensagem enviada!</h1>
    <p class="thankyou__desc">Obrigado pelo interesse! Retornaremos em até <strong>24 horas</strong>. Enquanto isso, fale direto no WhatsApp para resposta mais rápida:</p>
    <a href="https://wa.me/5591981504951?text=Ol%C3%A1%2C%20enviei%20um%20formul%C3%A1rio%20e%20quero%20um%20or%C3%A7amento" target="_blank" class="btn btn--whatsapp">Falar no WhatsApp</a>
    <div class="thankyou__timer">Você será redirecionado para o site em <strong id="countdown">10</strong>s...</div>
  </div>

  <script>
    var seconds = 10;
    var el = document.getElementById('countdown');
    var timer = setInterval(function() {
      seconds--;
      if (el) el.textContent = seconds;
      if (seconds <= 0) {
        clearInterval(timer);
        window.location.href = 'https://lucasdesignerweb.com.br';
      }
    }, 1000);
  </script>
</body>
</html>
